name: Sanjeevani CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies for OpenCV and MediaPipe
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0

      - name: Install backend dependencies
        run: |
          uv pip install -r requirements.txt --system

      - name: Run pytest test suite
        run: |
          pytest tests/ -v
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-test-secret-key-32-characters-minimum!
          JWT_REFRESH_SECRET_KEY: ci-test-refresh-key-32-characters-minimum!
          ENABLE_RATE_LIMITING: "false"

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite production build
        run: npm run build
